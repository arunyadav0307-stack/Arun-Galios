# ---------------------------------------------------------------------
# (1) AUDIT OF THE INHERITED 385-INSTANCE PROBE SUITE — OPEN-22
# ---------------------------------------------------------------------
inherited_probe_suite:
  status: OPEN                       # UNRECONSTRUCTIBLE — see below
  reported_result: "385 instances, 0 failures (BLUEPRINT.md A.8.5, L8, R-F2, §12.3)"
  epistemic_class: "[PROBE-DONE]"    # a real sandbox computation, NOT a paper result
  reproducible_from_this_repo: false
  regenerated_by_phase: P1           # superseded by regression_suite_v1 below

  what_the_blueprint_actually_records:
    even_half:
      count: 209
      q_set: [2, 4, 8, 16, 32, 64, 256]
      n_set: [3, 5, 7, 9, 15, 17, 21, 25, 31, 35]
      characteristic: even
      source_lines: ["BLUEPRINT.md A.7.1 'Verification' row", "BLUEPRINT.md §5.5 'Validation-scope amendments'", "BLUEPRINT.md §8.1 row B4", "BLUEPRINT.md §12.2 row R-F2"]
      caveat: >
        The q and n grids are recorded. 70 = 7 x 10 (q,n) grid points yielding
        209 instances, so multiple (lambda,k) per grid point were used, but
        WHICH ones is not recorded anywhere in the Blueprint.
    odd_half:
      count: 176
      q_set: OPEN
      n_set: OPEN
      characteristic: odd
      source_lines: ["BLUEPRINT.md A.7.1 'Secondary bug (nu>e)' row", "BLUEPRINT.md §5.5", "BLUEPRINT.md §12.2 row R-F2"]
      caveat: >
        NO q, NO n, NO lambda and NO k is recorded for any of the 176
        odd-characteristic instances. The only concrete odd instance named
        anywhere in the Blueprint is q=3, n=9 (the nu>e crash example,
        A.7.1: "e.g. q=3, n=9").

  open_fields:
    - field: lambda
      scope: all 385 instances
      status: OPEN
      value: null
      reason: >
        lambda appears nowhere in the Blueprint's account of this suite. The
        only lambdas the Blueprint fixes anywhere are those of the CP1
        quartet and the X1-X15 grid (§5.5), which are different instance
        sets used for different purposes. Recovering lambda by "fitting" the
        totals 209/176 would be inference from a reported total and is
        forbidden. No lambda is invented.
    - field: k
      scope: all 385 instances
      status: OPEN
      value: null
      reason: >
        k appears nowhere in the Blueprint's account of this suite. Moreover
        k is NOT an input to the two checks A.7.1 says were run
        ("product prod f_i^{m_i} = x^n - lambda holds and every factor passes
        an independent irreducibility test"): both are k-independent. So the
        inherited suite may or may not have varied k; it cannot be determined.
    - field: q
      scope: the 176 odd instances
      status: OPEN
      value: null
      reason: "Only 'odd-characteristic' is recorded. No q value is given for any of the 176."
    - field: n
      scope: the 176 odd instances
      status: OPEN
      value: null
      reason: "No n value is given for any of the 176. Only the single example q=3, n=9 is named."
    - field: expected_result
      scope: all 385 instances
      status: OPEN
      value: null
      reason: >
        The Blueprint reports only the AGGREGATE "0 failures". No per-instance
        expected factorisation (degrees, multiplicities, coefficients) is
        recorded for any instance, so there is nothing to assert per instance.
        This is deliberate: expected results must be COMPUTED, never asserted
        from a reported aggregate.

  verdict: >
    The inherited 385-instance suite CANNOT be reconstructed from the frozen
    Blueprint. It is retained here as an audit record only. P1 therefore
    executes the newly defined suite below, whose instances are fully
    specified by an explicit rule and whose expected results are computed,
    not asserted. The count produced by regression_suite_v1 is NOT expected
    to equal 385 and was NOT tuned towards it.

# ---------------------------------------------------------------------
# (2) THE SUITE P1 ACTUALLY EXECUTES — NEWLY DEFINED, FULLY SPECIFIED
# ---------------------------------------------------------------------
regression_suite_v1:
  status: DEFINED                    # fully specified; results computed by run_phase1.py
  epistemic_class: "[PLANNED] -> executed in P1"
  invented_values: none
  expected_results_asserted: false   # all expectations are COMPUTED

  generation_rule:
    instance_tuple: (q, n, lambda)
    q_grid: "even_q_grid + odd_q_grid (see grids below)"
    n_grid: [3, 5, 7, 9, 15, 17, 21, 25, 31, 35]   # recorded in BLUEPRINT.md A.7.1
    lambda_rule: >
      lambda ranges over ALL of F_q^*, enumerated deterministically as
      lambda = g^i for i = 0 .. q-2, where g is the multiplicative generator
      chosen by core/field.py (the first element of F_q^* in the canonical
      encoding order 1,2,3,... whose multiplicative order is exactly q-1).
      No choice is exercised: the set {g^i} is the whole of F_q^*.
    k: null
    k_status: NOT_AN_INPUT
    k_reason: >
      Per A.7.1 the two regression checks are (a) prod f_i^{m_i} = x^n - lambda
      and (b) each f_i irreducible. Both are independent of k. k is exercised
      separately, with explicit values, in cycle_suite below (which uses the
      frozen CP1 quartet and the X1-X7 grid from BLUEPRINT.md §5.5).
    derived_per_instance:
      p: "unique prime with q = p^e"
      e: "log_p(q)"
      nu: "v_p(n)"
      n_prime: "n / p^nu"
      P: "p^nu   (repeated-root multiplicity)"
      char: "even if p=2 else odd"
      mu: "the unique element with mu^{p^nu} = lambda, computed as sigma^{e-(nu mod e)}(lambda)  [defect (b) fix]"
      structural_category: "see categories"
      defect_coverage: "subset of {defect_a_even_char, defect_b_nu_gt_e}"

  categories:
    semisimple:      "P == 1 (nu == 0): x^n - lambda is squarefree"
    repeated_root:   "P > 1  (nu >= 1): every irreducible factor occurs with multiplicity P"
    nu_gt_e:         "nu > e : exercises defect (b), the sigma^{nu mod e} correction"
    even_char:       "p == 2 : exercises defect (a), the i=0 term of the absolute trace"
    coprime_np:      "gcd(n_prime, p) == 1 (always true by construction of n_prime)"

  grids:
    even_q_grid:
      values: [2, 4, 8, 16, 32, 64, 256]
      provenance: "RECORDED in BLUEPRINT.md A.7.1 (verification row) and §5.5"
      purpose: "defect (a) even-characteristic coverage"
    odd_q_grid:
      values: [3, 5, 9, 25, 27, 49, 81]
      provenance: >
        NOT RECORDED in the Blueprint (the 176 odd instances have no q or n).
        This grid is NEWLY DEFINED here and is labelled as such. It is chosen
        to (i) cover the only odd instance the Blueprint does name -- q=3,
        n=9 (nu=2 > e=1), which is the defect-(b) crash case -- and
        (ii) cover odd characteristic at e=1,2,3,4 so that nu>e, nu=e and
        nu<e all occur inside the recorded n grid. It is a choice of test
        INPUTS, not an assertion about the inherited suite, and no expected
        result is attached to it.
      defect_b_coverage:
        - q: 3
          n: 9
          nu: 2
          e: 1
          note: "nu=2 > e=1 -- the exact crashed instance named in A.7.1"
        - q: 5
          n: 25
          nu: 2
          e: 1
          note: "nu=2 > e=1 -- a second nu>e instance inside the recorded n grid"

  instances:
    # One entry per (q, n) grid point. lambda is enumerated explicitly (as the
    # complete exponent set {0..q-2} of the generator), so each entry fully
    # determines |F_q^*| instances. Total instance count = sum over entries of
    # lambda_count.
    #
    # q  p  e | n  nu n'  P | char | category                  | defects
    - {id: EV-001, q: 2,   p: 2, e: 1, n: 3,  nu: 0, n_prime: 3,  P: 1, char: even, lambda_count: 1,   lambda_exponents: [0],                    category: "even_char; semisimple",      defects: [defect_a_even_char], provenance: "BLUEPRINT A.7.1 even q-grid x n-grid"}
