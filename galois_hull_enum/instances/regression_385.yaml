# regression_385.yaml
#
# OPEN-22 — the 385-instance factorisation regression suite.
#
# Built FIRST, before any core implementation, as mandated by the P1 brief.
#
# TWO SEPARATE THINGS LIVE IN THIS FILE. Do not conflate them.
#
#   (1) `inherited_probe_suite`  — an AUDIT of the 385-instance suite that
#       the frozen Blueprint reports from the feasibility probe. It is NOT
#       reconstructible from the Blueprint. Every field that cannot be
#       recovered is marked OPEN with the exact reason. Nothing is inferred
#       from the totals 209/176, and no lambda, k, q or n is invented.
#
#   (2) `regression_suite_v1`     — a NEWLY DEFINED, fully specified,
#       deterministic regression suite that P1 actually executes. Its inputs
#       are chosen by an explicit stated rule; its EXPECTED RESULTS ARE NOT
#       ASSERTED ANYWHERE IN THIS FILE — they are computed by
#       scripts/run_phase1.py and written to results/.
#
# SEE `status` BELOW for the authoritative P1 status. OPEN-22 is NOT resolved.
#
# =====================================================================

