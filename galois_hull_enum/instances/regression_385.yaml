# ---------------------------------------------------------------------
# (3) CYCLE SUITE — where k IS specified (k is not an input to the
#     factorisation regression above, but IS an input to the #-map)
# ---------------------------------------------------------------------
cycle_suite:
  status: DEFINED
  purpose: >
    Exercises core/cycles.py (the frozen f^# construction and Algorithm E1
    cycle detection). k is explicit here. Instances are taken verbatim from
    BLUEPRINT.md §5.5 (grid X1-X7) and §6.2/CP1 (the four published
    factorisation instances), so every k below is FROZEN, not chosen.
  lambda_note: >
    lambda is given as an explicit multiplicative-order specification rather
    than as a symbol from the source papers, because the source's choice of
    primitive element (alpha, omega) is not recorded and is unrecoverable.
    Where the Blueprint fixes lambda only up to Frobenius conjugacy (F_25
    omega^8, F_81 omega^8) the acceptance criterion is the FACTORISATION
    SHAPE (degree multiset), which is Frobenius-invariant -- this is exactly
    what BLUEPRINT.md A.1 records ("identical shape", not "identical").
  instances:
    # BLUEPRINT.md section 5.5 grid X1-X7; k, j=e-k and the hypotheses (H1)/(H2)
    # are frozen values, not choices made here.
    - id: C1
      source: "BLUEPRINT 5.5 X1 = P1 Example 4"
      q: 9
      p: 3
      e: 2
      k: 1
      j: 1
      n: 3
      nu: 1
      n_prime: 1
      P: 3
      lambda_spec: "prime-field element 2 (= -1 in F_3)"
      lambda_order_r: 2
      hypothesis_H1: "r=2 divides 1+p^(e-k) = 1+3^1 = 4"
      hypothesis_H2: "gcd(n_prime=1, r=2) = 1"
    - id: C2
      source: "BLUEPRINT 5.5 X2 = P1 Example 5"
      q: 25
      p: 5
      e: 2
      k: 1
      j: 1
      n: 7
      nu: 0
      n_prime: 7
      P: 1
      lambda_spec: "g^8 where g generates F_25^* (order 24); ord(lambda) = 3"
      lambda_order_r: 3
      hypothesis_H1: "r=3 divides 1+5^1 = 6"
      hypothesis_H2: "gcd(7, 3) = 1"
    - id: C3
      source: "BLUEPRINT 5.5 X3 = P1 Example 6"
      q: 27
      p: 3
      e: 3
      k: 2
      j: 1
      n: 15
      nu: 1
      n_prime: 5
      P: 3
      lambda_spec: "prime-field element 2; equals alpha^13 = -1 (A.7.2); ord = 2"
      lambda_order_r: 2
      hypothesis_H1: "r=2 divides 1+3^(3-2) = 4"
      hypothesis_H2: "gcd(5, 2) = 1"
    - id: C4
      source: "BLUEPRINT 5.5 X4 = P3 Example 3.6"
      q: 81
      p: 3
      e: 4
      k: 2
      j: 2
      n: 21
      nu: 1
      n_prime: 7
      P: 3
      lambda_spec: "g^8 where g generates F_81^* (order 80); ord(lambda) = 10"
      lambda_order_r: 10
      hypothesis_H1: "r=10 divides 1+3^(4-2) = 10"
      hypothesis_H2: "gcd(7, 10) = 1"
    - id: C5
      source: "BLUEPRINT 5.5 X5"
      q: 81
      p: 3
      e: 4
      k: 3
      j: 1
      n: 5
      nu: 0
      n_prime: 5
      P: 1
      lambda_spec: "1"
      lambda_order_r: 1
      hypothesis_H1: "r=1 divides 1+3^1 = 4"
      hypothesis_H2: "gcd(5, 1) = 1"
    - id: C6
      source: "BLUEPRINT 5.5 X6"
      q: 81
      p: 3
      e: 4
      k: 3
      j: 1
      n: 17
      nu: 0
      n_prime: 17
      P: 1
      lambda_spec: "1"
      lambda_order_r: 1
      hypothesis_H1: "r=1 divides 4"
      hypothesis_H2: "gcd(17, 1) = 1"
    - id: C7
      source: "BLUEPRINT 5.5 X7"
      q: 81
      p: 3
      e: 4
      k: 3
      j: 1
      n: 25
      nu: 0
      n_prime: 25
      P: 1
      lambda_spec: "1"
      lambda_order_r: 1
      hypothesis_H1: "r=1 divides 4"
      hypothesis_H2: "gcd(25, 1) = 1"
